<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مواقيت الصلاة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0A2E2B;
    --gold:#C9A15D;
    --gold-soft:#E4C486;
    --sage:#6E9587;
    --cream:#F3EEE1;
    --ink:#07211E;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Tajawal', sans-serif;
    background:
      radial-gradient(circle at 50% -10%, #14514A 0%, transparent 55%),
      linear-gradient(180deg, var(--bg-deep) 0%, var(--ink) 100%);
    color:var(--cream);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }
  .app{ width:100%; max-width:460px; }

  .arch-wrap{ position:relative; display:flex; justify-content:center; margin-bottom:-1px; }
  .arch{
    width:100%;
    background:linear-gradient(160deg, #12463F 0%, #0A2E2B 100%);
    border:1px solid rgba(201,161,93,0.35);
    border-bottom:none;
    border-top-left-radius:220px;
    border-top-right-radius:220px;
    padding:46px 28px 32px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .arch::before{
    content:"";
    position:absolute; inset:10px;
    border:1px solid rgba(201,161,93,0.25);
    border-bottom:none;
    border-top-left-radius:200px;
    border-top-right-radius:200px;
    pointer-events:none;
  }
  .city-row{
    font-size:13px; color:var(--sage); letter-spacing:.5px;
    margin-bottom:18px; display:flex; align-items:center;
    justify-content:center; gap:6px; cursor:pointer;
  }
  .city-row .dot{opacity:.6}
  .next-label{ font-size:14px; color:var(--gold-soft); font-weight:500; }
  .next-name{
    font-family:'Amiri', serif; font-size:44px; font-weight:700;
    color:var(--cream); margin:6px 0 14px;
  }
  .countdown{
    font-size:38px; font-weight:700; letter-spacing:2px;
    color:var(--gold); font-variant-numeric: tabular-nums;
  }
  .countdown-sub{ font-size:12px; color:var(--sage); margin-top:6px; }

  .card{
    background:#0D3833;
    border:1px solid rgba(201,161,93,0.35);
    border-top:none;
    border-radius:0 0 20px 20px;
    padding:6px 22px 22px;
  }
  .row{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 4px; border-bottom:1px solid rgba(255,255,255,0.06);
  }
  .row:last-child{border-bottom:none}
  .row.active{ position:relative; }
  .row.active::after{
    content:""; position:absolute; right:-22px; top:0; bottom:0;
    width:4px; background:var(--gold); border-radius:4px 0 0 4px;
  }
  .row.done{opacity:.4}
  .p-name{ font-family:'Amiri', serif; font-size:20px; color:var(--cream); }
  .row.active .p-name{color:var(--gold-soft); font-weight:700;}
  .p-time{ font-size:17px; font-weight:500; color:var(--sage); font-variant-numeric: tabular-nums; }
  .row.active .p-time{color:var(--gold);}

  .footer-actions{ display:flex; gap:10px; margin-top:18px; }
  .btn{
    flex:1; background:transparent; border:1px solid rgba(201,161,93,0.4);
    color:var(--gold-soft); padding:12px 10px; border-radius:12px;
    font-family:'Tajawal', sans-serif; font-size:14px; font-weight:500;
    cursor:pointer; transition:background .2s ease, color .2s ease;
  }
  .btn:hover{background:rgba(201,161,93,0.12);}
  .btn.on{ background:var(--gold); color:var(--ink); border-color:var(--gold); font-weight:700; }

  .status-msg{ text-align:center; font-size:12px; color:var(--sage); margin-top:14px; min-height:16px; }

  .city-editor{ display:none; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .city-editor.show{display:flex;}
  .city-editor select{
    flex:1; min-width:140px;
    background:rgba(0,0,0,0.25); border:1px solid rgba(201,161,93,0.4);
    border-radius:10px; padding:9px 12px; color:var(--cream);
    font-family:'Tajawal', sans-serif; font-size:13px;
  }
  .city-editor option{ background:#0D3833; color:var(--cream); }
  .city-editor button{
    background:var(--gold); border:none; border-radius:10px; padding:9px 16px;
    font-family:'Tajawal', sans-serif; font-weight:700; color:var(--ink);
    cursor:pointer; font-size:13px;
  }

  @keyframes pulseGlow{
    0%,100%{ text-shadow:0 0 0 rgba(201,161,93,0); }
    50%{ text-shadow:0 0 18px rgba(201,161,93,0.55); }
  }
  .countdown.tick{ animation:pulseGlow 2s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce){ .countdown.tick{ animation:none; } }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
(function(){

  const CITIES = {
    "قفصة":      { lat: 34.425, lon: 8.784 },
    "تونس":      { lat: 36.8065, lon: 10.1815 },
    "صفاقس":     { lat: 34.7406, lon: 10.7603 },
    "سوسة":      { lat: 35.8256, lon: 10.6369 },
    "قابس":      { lat: 33.8815, lon: 10.0982 },
    "بنزرت":     { lat: 37.2744, lon: 9.8739 },
    "القيروان":  { lat: 35.6781, lon: 10.0963 },
    "المنستير":  { lat: 35.7643, lon: 10.8113 },
    "نابل":      { lat: 36.4561, lon: 10.7376 },
    "مدنين":     { lat: 33.3549, lon: 10.5055 },
    "توزر":      { lat: 33.9197, lon: 8.1335 },
    "قبلي":      { lat: 33.7050, lon: 8.9690 }
  };

  const state = {
    cityName: "قفصة",
    lat: CITIES["قفصة"].lat,
    lon: CITIES["قفصة"].lon,
    fajrAngle: 18,
    ishaAngle: 18,
    notifEnabled: false
  };

  const PRAYERS = ["Fajr","Dhuhr","Asr","Maghrib","Isha"];
  const LABELS = { Fajr:"الفجر", Dhuhr:"الظهر", Asr:"العصر", Maghrib:"المغرب", Isha:"العشاء" };

  const app = document.getElementById('app');
  let tickInterval = null;
  let scheduledTimeouts = [];

  function toRad(d){ return d*Math.PI/180; }
  function toDeg(r){ return r*180/Math.PI; }

  function dayOfYear(date){
    const start = new Date(date.getFullYear(),0,0);
    const diff = date - start;
    return Math.floor(diff/86400000);
  }

  function sunPosition(date){
    const N = dayOfYear(date);
    const gamma = 2*Math.PI/365 * (N - 1);
    const eqTime = 229.18*(0.000075 + 0.001868*Math.cos(gamma) - 0.032077*Math.sin(gamma)
                  - 0.014615*Math.cos(2*gamma) - 0.040849*Math.sin(2*gamma));
    const decl = 0.006918 - 0.399912*Math.cos(gamma) + 0.070257*Math.sin(gamma)
               - 0.006758*Math.cos(2*gamma) + 0.000907*Math.sin(2*gamma)
               - 0.002697*Math.cos(3*gamma) + 0.00148*Math.sin(3*gamma);
    return { eqTime, decl };
  }

  function hourAngle(lat, decl, zenithDeg){
    const latR = toRad(lat);
    const cosH = (Math.cos(toRad(zenithDeg)) - Math.sin(latR)*Math.sin(decl)) / (Math.cos(latR)*Math.cos(decl));
    const clamped = Math.max(-1, Math.min(1, cosH));
    return toDeg(Math.acos(clamped));
  }

  function asrHourAngle(lat, decl, shadowFactor){
    const latR = toRad(lat);
    const altitude = Math.atan(1/(shadowFactor + Math.tan(Math.abs(latR - decl))));
    const zenith = 90 - toDeg(altitude);
    return hourAngle(lat, decl, zenith);
  }

  function minutesToHHMM(mins){
    let m = ((mins % 1440) + 1440) % 1440;
    const h = Math.floor(m/60);
    const mm = Math.round(m%60);
    return { h, m: mm, str: String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0') };
  }

  function computeTimings(date, lat, lon, fajrAngle, ishaAngle){
    const { eqTime, decl } = sunPosition(date);
    const tzOffset = -date.getTimezoneOffset()/60;
    const solarNoonUTC = 720 - 4*lon - eqTime;
    const localNoon = solarNoonUTC + tzOffset*60;

    const haSunset = hourAngle(lat, decl, 90.833);
    const haFajr = hourAngle(lat, decl, 90 + fajrAngle);
    const haIsha = hourAngle(lat, decl, 90 + ishaAngle);
    const haAsr = asrHourAngle(lat, decl, 1);

    return {
      Fajr: minutesToHHMM(localNoon - 4*haFajr),
      Sunrise: minutesToHHMM(localNoon - 4*haSunset),
      Dhuhr: minutesToHHMM(localNoon),
      Asr: minutesToHHMM(localNoon + 4*haAsr),
      Maghrib: minutesToHHMM(localNoon + 4*haSunset),
      Isha: minutesToHHMM(localNoon + 4*haIsha)
    };
  }

  function timeToDateToday(hhmm){
    const now = new Date();
    return new Date(now.getFullYear(), now.getMonth(), now.getDate(), hhmm.h, hhmm.m, 0);
  }

  function fmtCountdown(ms){
    if(ms < 0) ms = 0;
    const totalSec = Math.floor(ms/1000);
    const h = String(Math.floor(totalSec/3600)).padStart(2,'0');
    const m = String(Math.floor((totalSec%3600)/60)).padStart(2,'0');
    const s = String(totalSec%60).padStart(2,'0');
    return `${h}:${m}:${s}`;
  }

  function getOrderedList(timings){
    return PRAYERS.map(key => ({ key, label:LABELS[key], time: timings[key], dateObj: timeToDateToday(timings[key]) }));
  }

  function findNext(list){
    const now = new Date();
    for(const p of list){ if(p.dateObj > now) return p; }
    return null;
  }

  function render(){
    const today = new Date();
    const timings = computeTimings(today, state.lat, state.lon, state.fajrAngle, state.ishaAngle);
    const list = getOrderedList(timings);
    let next = findNext(list);
    let nextTarget, nextLabel, nextKey;

    if(next){
      nextTarget = next.dateObj; nextLabel = next.label; nextKey = next.key;
    } else {
      const tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate()+1);
      const tmrTimings = computeTimings(tomorrow, state.lat, state.lon, state.fajrAngle, state.ishaAngle);
      nextTarget = new Date(tomorrow.getFullYear(), tomorrow.getMonth(), tomorrow.getDate(), tmrTimings.Fajr.h, tmrTimings.Fajr.m, 0);
      nextLabel = LABELS.Fajr; nextKey = "Fajr";
    }

    const dateStr = today.toLocaleDateString('ar-TN', { weekday:'long', year:'numeric', month:'long', day:'numeric' });

    app.innerHTML = `
      <div class="arch-wrap">
        <div class="arch">
          <div class="city-row" id="cityToggle">
            <span>📍 ${state.cityName}، تونس</span>
            <span class="dot">•</span>
            <span>تغيير</span>
          </div>
          <div class="city-editor" id="cityEditor">
            <select id="citySelect">
              ${Object.keys(CITIES).map(c => `<option value="${c}" ${c===state.cityName?'selected':''}>${c}</option>`).join('')}
            </select>
            <button id="cityConfirm">تحديث</button>
          </div>
          <div class="next-label">الصلاة القادمة</div>
          <div class="next-name">${nextLabel}</div>
          <div class="countdown tick" id="countdown">--:--:--</div>
          <div class="countdown-sub">${dateStr}</div>
        </div>
      </div>
      <div class="card">
        ${list.map(p => {
          const isActive = p.key === nextKey;
          const passed = !isActive && next && p.dateObj <= today;
          return `<div class="row ${isActive ? 'active':''} ${passed ? 'done':''}">
            <div class="p-name">${p.label}</div>
            <div class="p-time">${p.time.str}</div>
          </div>`;
        }).join('')}
        <div class="footer-actions">
          <button class="btn ${state.notifEnabled ? 'on':''}" id="notifBtn">${state.notifEnabled ? '✓ التنبيهات مفعّلة' : 'فعّل التنبيهات'}</button>
        </div>
        <div class="status-msg" id="statusMsg"></div>
      </div>
    `;

    document.getElementById('cityToggle').addEventListener('click', () => {
      document.getElementById('cityEditor').classList.toggle('show');
    });
    document.getElementById('cityConfirm').addEventListener('click', () => {
      const sel = document.getElementById('citySelect').value;
      state.cityName = sel;
      state.lat = CITIES[sel].lat;
      state.lon = CITIES[sel].lon;
      render();
    });
    document.getElementById('notifBtn').addEventListener('click', toggleNotifications);

    if(tickInterval) clearInterval(tickInterval);
    tickInterval = setInterval(() => {
      const el = document.getElementById('countdown');
      if(!el) return;
      const diff = nextTarget - new Date();
      if(diff <= 0){ clearInterval(tickInterval); render(); return; }
      el.textContent = fmtCountdown(diff);
    }, 1000);

    if(state.notifEnabled) scheduleNotifications(list);
  }

  function toggleNotifications(){
    if(!('Notification' in window)){
      showStatus('التنبيهات غير مدعومة في هذا المتصفح');
      return;
    }
    if(state.notifEnabled){
      state.notifEnabled = false;
      clearScheduledNotifications();
      render();
      return;
    }
    Notification.requestPermission().then(perm => {
      if(perm === 'granted'){
        state.notifEnabled = true;
        showStatus('تم تفعيل التنبيهات لصلوات اليوم');
      } else {
        showStatus('لم يتم منح إذن التنبيهات');
      }
      render();
    });
  }

  function clearScheduledNotifications(){
    scheduledTimeouts.forEach(t => clearTimeout(t));
    scheduledTimeouts = [];
  }

  function scheduleNotifications(list){
    clearScheduledNotifications();
    const now = new Date();
    list.forEach(p => {
      const diff = p.dateObj - now;
      if(diff > 0){
        const id = setTimeout(() => {
          try{ new Notification('حان الآن وقت ' + p.label, { body:'موعد صلاة ' + p.label + ' — ' + p.time.str }); }catch(e){}
        }, diff);
        scheduledTimeouts.push(id);
      }
    });
  }

  function showStatus(msg){
    const el = document.getElementById('statusMsg');
    if(el) el.textContent = msg;
  }

  render();
})();
</script>
</body>
</html>
